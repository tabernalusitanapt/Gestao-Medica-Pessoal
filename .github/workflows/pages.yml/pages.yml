name: Publish to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          mkdir dist
          if [ -f site-source.zip ]; then
            unzip -oq site-source.zip -x .github/\* -d dist
          else
            git archive --format=tar HEAD | tar -xf - -C dist
          fi
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Publish source files
        run: |
          if [ -f site-source.zip ]; then
            unzip -oq site-source.zip -x .github/\* -d .
            rm -f site-source.zip gestao-medica-pessoal-publication.zip
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Publish application source files"
            git push
          fi
